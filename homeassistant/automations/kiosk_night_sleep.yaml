blueprint:
  name: "RPi Kiosk - Scheduled Night Sleep & Morning Wake"
  description: "Turns off or dims the Raspberry Pi Kiosk screen during bedtime hours and restores it in the morning."
  domain: automation
  input:
    kiosk_screen:
      name: Kiosk Screen Switch
      default: switch.rpi_kiosk_screen
      selector:
        entity:
          domain: switch
    sleep_time:
      name: Night Sleep Time
      default: "23:00:00"
      selector:
        time: {}
    wake_time:
      name: Morning Wake Time
      default: "07:00:00"
      selector:
        time: {}

mode: single

trigger:
  - platform: time
    at: !input sleep_time
    id: "sleep"
  - platform: time
    at: !input wake_time
    id: "wake"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: "sleep"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input kiosk_screen
      - conditions:
          - condition: trigger
            id: "wake"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input kiosk_screen
