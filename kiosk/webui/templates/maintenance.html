<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance in Progress — KioskOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090d16 60%, #030712 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }
    .card {
      background: rgba(19, 27, 46, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 48px 40px;
      width: 500px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .icon-box {
      font-size: 50px;
      animation: swing 2s ease-in-out infinite alternate;
    }
    @keyframes swing {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: -0.3px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar {
      width: 30%;
      height: 100%;
      background: #fbbf24;
      animation: sweep 2s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); width: 20%; }
      50% { width: 40%; }
      100% { transform: translateX(350%); width: 20%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🛠️</div>
    <div class="badge">SYSTEM MAINTENANCE</div>
    <h1>Maintenance in Progress</h1>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <p>
      The kiosk administrator is currently maintaining this system.<br>
      The display will automatically refresh when complete.
    </p>
  </div>
  <script>
    setInterval(() => {
      fetch('/api/status')
        .then(r => r.json())
        .then(data => {
          if (data && data.dashboard_url) {
            window.location.href = data.dashboard_url;
          }
        })
        .catch(() => {});
    }, 3000);
  </script>
</body>
</html>
