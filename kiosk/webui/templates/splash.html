<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KioskOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: opacity 0.8s ease-in-out;
    }

    .boot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 52px;
    }

    /* Minimalist Apple-style Logo Emblem */
    .apple-emblem {
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: emblemFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-emblem svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.35));
    }

    /* Apple-style Thin Loading Progress Bar */
    .progress-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      transition: width 0.35s ease;
    }

    @keyframes emblemFadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="boot-container">
    <div class="apple-emblem">
      <!-- Apple Logo Vector -->
      <svg viewBox="0 0 170 170">
        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.66-7.85-11.89-14.42-6.53-10.13-11.66-21.57-15.39-34.33-3.73-12.75-5.6-24.62-5.6-35.59 0-14.37 3.59-26.4 10.76-36.08 7.18-9.68 16.32-14.63 27.43-14.86 4.78 0 10.05 1.25 15.82 3.76 5.76 2.5 9.77 3.82 12.02 3.94 1.85-.12 6.04-1.5 12.57-4.13 6.52-2.63 12.07-3.83 16.65-3.59 12.63.76 22.84 5.34 30.63 13.72-11.09 6.75-16.52 16.05-16.3 27.88.22 9.25 3.75 16.98 10.59 23.18 6.84 6.2 14.86 9.69 24.06 10.45-2.07 6.32-4.57 12.86-7.51 19.63zM119.22 31.84c0-7.39 2.67-14.38 8.01-20.97 5.34-6.59 11.97-10.51 19.89-11.75.11 1.09.16 2.07.16 2.94 0 7.39-2.73 14.45-8.19 21.18-5.46 6.73-12.19 10.74-20.19 12.03-.1-.97-.15-1.95-.15-2.94z" />
      </svg>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const progressFill = document.getElementById('progressFill');
    let targetUrl = '{{ dashboard_url or "http://homeassistant.local:8123/lovelace/0?kiosk" }}';

    // Apple boot progress animation sequence
    setTimeout(() => { progressFill.style.width = '25%'; }, 400);
    setTimeout(() => { progressFill.style.width = '60%'; }, 1200);
    setTimeout(() => { progressFill.style.width = '88%'; }, 2000);
    setTimeout(() => { progressFill.style.width = '100%'; }, 2600);

    setTimeout(() => {
      // Smooth Apple-style fade transition into Home Assistant
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.replace(targetUrl);
      }, 700);
    }, 3200);
  </script>
</body>
</html>
