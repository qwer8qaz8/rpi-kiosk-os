<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KioskOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background-color: #030712;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: opacity 0.6s ease-in-out;
      position: relative;
    }

    /* Ambient background glowing particles */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
      pointer-events: none;
      animation: ambientPulse 4s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .boot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 2;
      transition: all 0.5s ease;
    }

    /* KioskOS Custom Cyber Logo */
    .kiosk-logo-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring {
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      border: 2px solid transparent;
      border-top-color: #06b6d4;
      border-right-color: #3b82f6;
      animation: spinRing 3s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-box {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .logo-box svg {
      width: 52px;
      height: 52px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #64748b;
      text-align: center;
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
      height: 18px;
    }

    /* KioskOS Loading Progress Bar */
    .progress-track {
      width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      transition: width 0.35s ease;
    }

    /* Error / Offline Screen Container */
    .error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 520px;
      padding: 32px 28px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(239, 68, 68, 0.15);
      z-index: 10;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .radar-icon {
      position: relative;
      width: 68px;
      height: 68px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid #ef4444;
      opacity: 0.8;
      animation: radarWave 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    @keyframes radarWave {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .error-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .diag-box {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
    }

    .diag-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .diag-row:last-child { border-bottom: none; }
    .diag-val { color: #38bdf8; font-weight: 600; }

    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-retry {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-retry:hover { background: #1d4ed8; }

    .btn-settings {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-settings:hover { background: #334155; color: #ffffff; }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Boot Splash Screen -->
  <div class="boot-container" id="bootContainer">
    <div class="kiosk-logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-box">
        <!-- KioskOS Authentic Hex Display & Lightning Logo -->
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="#38bdf8" stroke-width="2.5" fill="rgba(56, 189, 248, 0.08)"/>
          <polygon points="32,10 52,22 52,42 32,54 12,42 12,22" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
          <path d="M34 16L22 34H32L30 48L42 30H32L34 16Z" fill="url(#boltGrad)" filter="drop-shadow(0 0 6px #38bdf8)"/>
          <defs>
            <linearGradient id="boltGrad" x1="22" y1="16" x2="42" y2="48" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38bdf8"/>
              <stop offset="1" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <div>
      <div class="brand-title">KioskOS</div>
      <div class="brand-subtitle">Smart Display Platform</div>
    </div>

    <div class="status-text" id="statusText">Initializing display engine...</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Fancy Offline / Error Screen -->
  <div class="error-container" id="errorContainer">
    <div class="radar-icon">
      <div class="radar-pulse"></div>
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <div class="error-title">Unable to Connect to Dashboard</div>
    <div class="error-desc">The kiosk display server could not establish a connection to your configured dashboard.</div>

    <div class="diag-box">
      <div class="diag-row">
        <span>Target URL:</span>
        <span class="diag-val" id="diagUrl">Loading...</span>
      </div>
      <div class="diag-row">
        <span>Network Status:</span>
        <span class="diag-val" id="diagNet">Checking...</span>
      </div>
      <div class="diag-row">
        <span>Auto-Retry:</span>
        <span class="diag-val" id="diagRetry">in 10s</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-retry" onclick="retryConnectNow()">🔄 Retry Now</button>
      <button class="btn btn-settings" onclick="openSettingsNow()">⚙️ Control Center</button>
    </div>
  </div>

  <script>
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const bootContainer = document.getElementById('bootContainer');
    const errorContainer = document.getElementById('errorContainer');
    const diagUrl = document.getElementById('diagUrl');
    const diagNet = document.getElementById('diagNet');
    const diagRetry = document.getElementById('diagRetry');

    let targetUrl = '{{ dashboard_url or "http://homeassistant.local:8123/lovelace/0?kiosk" }}';
    diagUrl.textContent = targetUrl;

    let countdown = 10;
    let countdownTimer = null;

    // KioskOS Boot Sequence
    setTimeout(() => { progressFill.style.width = '30%'; statusText.textContent = 'Loading Wayland graphics stack...'; }, 300);
    setTimeout(() => { progressFill.style.width = '65%'; statusText.textContent = 'Checking network connectivity...'; }, 900);
    setTimeout(() => { progressFill.style.width = '90%'; statusText.textContent = 'Connecting to dashboard...'; }, 1600);

    // Verify if dashboard URL is reachable
    setTimeout(async () => {
      progressFill.style.width = '100%';
      let reachable = false;

      try {
        // Test connectivity via fast HEAD/GET fetch
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);
        await fetch(targetUrl, { mode: 'no-cors', signal: controller.signal });
        reachable = true;
      } catch (e) {
        // If fetch failed, also verify through local WebUI reachability check
        try {
          const r = await fetch('http://127.0.0.1:8080/api/status');
          const st = await r.json();
          diagNet.textContent = st.ip_address || 'Connected';
          reachable = true;
        } catch (e2) {
          reachable = false;
        }
      }

      if (reachable) {
        statusText.textContent = 'Display Ready ✓';
        setTimeout(() => {
          document.body.style.opacity = '0';
          setTimeout(() => {
            window.location.replace(targetUrl);
          }, 500);
        }, 400);
      } else {
        // Show Fancy Offline Error Screen
        bootContainer.style.display = 'none';
        errorContainer.style.display = 'flex';
        diagNet.textContent = navigator.onLine ? 'Online (Host Unreachable)' : 'Offline (No Link)';
        startCountdown();
      }
    }, 2200);

    function startCountdown() {
      countdown = 10;
      diagRetry.textContent = `in ${countdown}s`;
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdown--;
        diagRetry.textContent = `in ${countdown}s`;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          retryConnectNow();
        }
      }, 1000);
    }

    function retryConnectNow() {
      if (countdownTimer) clearInterval(countdownTimer);
      diagRetry.textContent = 'Connecting...';
      window.location.reload();
    }

    function openSettingsNow() {
      window.location.href = 'http://127.0.0.1:8080/';
    }
  </script>
</body>
</html>
