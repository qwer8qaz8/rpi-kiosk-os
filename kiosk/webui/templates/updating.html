<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installing System Update...</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #23314d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .update-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: 520px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .spinner-box {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(56, 189, 248, 0.15);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .spinner-icon {
      position: absolute;
      font-size: 32px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 10px;
      animation: indeterminate 2s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 20%; }
      50% { width: 50%; }
      100% { transform: translateX(350%); width: 30%; }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1s infinite alternate;
    }

    .notice {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="update-card">
    <div class="spinner-box">
      <div class="spinner-ring"></div>
      <div class="spinner-icon">🔄</div>
    </div>
    <h1>Installing System Update</h1>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Updating Raspberry Pi Kiosk OS...</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <p>Please keep your device plugged in.<br>The display will automatically refresh when complete.</p>
    <div class="notice">Protected system update in progress &bull; Auto-reload enabled</div>
  </div>

  <script>
    // Poll WebUI to automatically redirect when display/kiosk reloads
    setInterval(() => {
      fetch('/api/status')
        .then(r => r.json())
        .then(data => {
          if (data && data.dashboard_url) {
            // Once update finishes, check if update route is cleared
            fetch('/api/update/status')
              .then(r => r.json())
              .then(s => {
                if (!s.updating) {
                  window.location.href = data.dashboard_url;
                }
              })
              .catch(() => {});
          }
        })
        .catch(() => {});
    }, 2500);
  </script>
</body>
</html>
