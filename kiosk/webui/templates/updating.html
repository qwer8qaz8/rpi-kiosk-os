<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KioskOS System Update</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background-color: #030712;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
      pointer-events: none;
      animation: ambientPulse 3s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .update-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      max-width: 480px;
      z-index: 2;
    }

    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(16, 185, 129, 0.3);
    }

    .logo-box svg {
      width: 46px;
      height: 46px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .status-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
    }

    .status-subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    .progress-track {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg, #059669, #34d399);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="update-container">
    <div class="logo-box">
      <!-- KioskOS Hexagon Update Icon -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="#34d399" stroke-width="2.5" fill="rgba(52, 211, 153, 0.08)"/>
        <path d="M32 18V38M32 38L24 30M32 38L40 30M20 46H44" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div>
      <div class="brand-title">KioskOS</div>
      <div class="status-title" id="statusTitle">Installing System Update...</div>
      <div class="status-subtitle" id="statusSub">Downloading packages from GitHub. Kiosk will restart automatically.</div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const fill = document.getElementById('progressFill');
    const title = document.getElementById('statusTitle');
    const sub = document.getElementById('statusSub');
    let pct = 20;

    const pollInterval = setInterval(async () => {
      try {
        const res = await fetch('/api/update/status');
        const data = await res.json();
        if (data.in_progress) {
          pct = Math.min(85, pct + 8);
          fill.style.width = pct + '%';
          if (data.step) {
            title.textContent = data.step;
          }
        } else if (data.status === 'success' || pct >= 85) {
          clearInterval(pollInterval);
          fill.style.width = '100%';
          title.textContent = 'Update Complete ✓';
          sub.textContent = 'Restarting system display now...';
          setTimeout(() => {
            fetch('/api/reboot', { method: 'POST' }).catch(() => {});
          }, 1500);
        }
      } catch (e) {
        pct = Math.min(95, pct + 5);
        fill.style.width = pct + '%';
      }
    }, 1500);
  </script>
</body>
</html>
